
plugins {
    id 'java'
    id 'io.qameta.allure' version '4.3.0'
}

group 'ru.netology'
version '1.0-SNAPSHOT'

java {
    sourceCompatibility = 11
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    // Selenide
    testImplementation 'com.codeborne:selenide:6.19.1'

    // Faker
    testImplementation 'com.github.javafaker:javafaker:1.0.2'

    // Lombok
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

    // Allure для JUnit 5 и Selenide
    testImplementation 'io.qameta.allure:allure-junit5:2.35.5'
    testImplementation 'io.qameta.allure:allure-selenide:2.35.5'
}

allure {
    version = '2.42.1'
}

test {
    useJUnitPlatform()

    systemProperty 'selenide.headless',
            System.getProperty('selenide.headless', 'false')

    systemProperty 'chromeoptions.prefs',
            System.getProperty(
                    'chromeoptions.prefs',
                    'profile.password_manager_leak_detection=false'
            )
}
