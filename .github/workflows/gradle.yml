
name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Start application
        run: java -jar ./artifacts/app-replan-delivery.jar &

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:9999/ -o /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Run Selenide tests
        run: bash ./gradlew test --info -Dselenide.headless=true
